[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[optional-dependencies]
dev = [
  "pytest ~= 8.3.5"
]

[project]
name = "KapowarrReact"
version = "0.8.0"
description = "Kapowarr React is a software to build and manage a comic book library, fitting in the *arr suite of software."
authors = [
  {name = "Cas van Tijn"}
]
maintainers = [
  {name = "matt1432", email = "matt@nelim.org"}
]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">= 3.13"
dependencies = [
  "aiohttp ~= 3.14.1",
  "beautifulsoup4 ~= 4.15.0",
  "bencoding ~= 0.2.6",
  "cryptography ~= 49.0.0",
  "flask ~= 3.1",
  "flask-socketio ~= 5.6.0",
  "libgencomics @ git+https://github.com/matt1432/LibgenComics.git@v1.3.5",
  "Pillow",
  "requests ~= 2.34.2",
  "simyan ~= 2.0.0",
  "waitress ~= 3.0.2",
  "websocket-client ~= 1.9.0",
  "qbittorrent-api"
]

[project.scripts]
kapowarr-react = "kapowarr:main"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.ruff]
target-version = "py313"
line-length = 80
lint.select = ["E", "F", "I", "U"]
lint.ignore = ["E501"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"frontend" = ["templates/*"]
"frontend.static" = ["css/*", "img/*", "js/*.js", "fonts/*"]

[tool.setuptools.packages.find]
where = ["src"]
